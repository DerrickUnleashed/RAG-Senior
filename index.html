<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Query System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        .chat-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .message {
            margin: 10px 0;
        }
        .query {
            background-color: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            margin: 5px 0;
            text-align: right;
        }
        .response {
            background-color: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            margin: 5px 0;
        }
        .input-container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
        }
        #queryForm {
            display: flex;
            gap: 10px;
        }
        #queryInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .feedback-btn {
            background: #6c757d;
            font-size: 0.8em;
            padding: 5px 10px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <h1 style="text-align: center;">RAG Query System</h1>
    
    <div class="chat-container">
        {% for message in chat_history %}
        <div class="message" data-message-id="{{ message.id }}">
            <div class="query">
                <strong>You:</strong> {{ message.query }}
            </div>
            <div class="response">
                <strong>Bot:</strong> {{ message.response }}
                <button class="feedback-btn" onclick="provideFeedback({{ message.id }})">Provide Feedback</button>
            </div>
        </div>
        {% endfor %}
    </div>

    <div class="input-container">
        <form id="queryForm">
            <input type="text" id="queryInput" name="query" placeholder="Enter your query..." required>
            <button type="submit">Send</button>
        </form>
    </div>

    <script>
        $(document).ready(function() {
            $('#queryForm').on('submit', function(e) {
                e.preventDefault();
                const query = $('#queryInput').val();
                
                $.ajax({
                    type: 'POST',
                    url: '/',
                    contentType: 'application/json',
                    data: JSON.stringify({ query: query }),
                    success: function(response) {
                        // Create new message elements
                        const messageHtml = `
                            <div class="message" data-message-id="${response.id}">
                                <div class="query">
                                    <strong>You:</strong> ${response.query}
                                </div>
                                <div class="response">
                                    <strong>Bot:</strong> ${response.response}
                                    <button class="feedback-btn" onclick="provideFeedback(${response.id})">Provide Feedback</button>
                                </div>
                            </div>
                        `;
                        
                        // Append new message to chat container
                        $('.chat-container').append(messageHtml);
                        
                        // Clear input
                        $('#queryInput').val('');
                        
                        // Scroll to bottom
                        $('.chat-container').scrollTop($('.chat-container')[0].scrollHeight);
                    }
                });
            });
        });

        function provideFeedback(messageId) {
            // Implement feedback functionality here
            console.log('Provide feedback for message:', messageId);
        }
    </script>
</body>
</html>
